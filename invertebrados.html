<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Bosque Encantado de los Invertebrados - 3º Primaria</title>
    <!-- Fuentes Google Fonts con estética Slavic Folk / Cuento Tradicional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-parchment: #FBF4E4;
            --card-cream: #FFFDF7;
            --slavic-red: #B22222;
            --slavic-red-dark: #801313;
            --forest-green: #234D32;
            --cobalt-blue: #1D4E89;
            --ochre-gold: #D99B26;
            --ink-dark: #2B1E16;
            --border-wood: #5C3A21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-parchment);
            color: var(--ink-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Patrón sutil inspirado en bordados tradicionales eslavos (Vyshyvanka / Rusnyk) */
            background-image: 
                radial-gradient(var(--slavic-red) 1.5px, transparent 1.5px),
                radial-gradient(var(--cobalt-blue) 1.5px, var(--bg-parchment) 1.5px);
            background-size: 36px 36px;
            background-position: 0 0, 18px 18px;
        }

        /* Cenefa superior e inferior estilo bordado */
        .folk-border-strip {
            width: 100%;
            height: 18px;
            background-image: repeating-linear-gradient(
                45deg,
                var(--slavic-red) 0px,
                var(--slavic-red) 6px,
                var(--ochre-gold) 6px,
                var(--ochre-gold) 12px,
                var(--forest-green) 12px,
                var(--forest-green) 18px,
                var(--card-cream) 18px,
                var(--card-cream) 24px
            );
            border-top: 2px solid var(--border-wood);
            border-bottom: 2px solid var(--border-wood);
        }

        .main-frame {
            max-width: 780px;
            width: 100%;
            background-color: var(--card-cream);
            border: 4px solid var(--border-wood);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(43, 30, 22, 0.25), inset 0 0 0 6px var(--bg-parchment), inset 0 0 0 8px var(--slavic-red);
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: var(--forest-green);
            color: #FFFDF7;
            text-align: center;
            padding: 24px 20px 18px;
            position: relative;
        }

        .folk-ornament {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.85rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--ink-dark);
            color: var(--ochre-gold);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #FBF4E4;
            font-style: italic;
        }

        .content-area {
            padding: 28px 32px;
        }

        /* Barra de progreso estilo amuletos/flores folk */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 18px;
            background-color: var(--bg-parchment);
            border: 2px solid var(--ochre-gold);
            border-radius: 10px;
        }

        .step-dots {
            display: flex;
            gap: 12px;
        }

        .dot {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--border-wood);
            background-color: var(--card-cream);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: var(--ochre-gold);
            color: var(--ink-dark);
            transform: scale(1.12);
            box-shadow: 0 0 8px rgba(217, 155, 38, 0.7);
        }

        .dot.correct {
            background-color: var(--forest-green);
            color: white;
            border-color: var(--forest-green);
        }

        .dot.wrong {
            background-color: var(--slavic-red);
            color: white;
            border-color: var(--slavic-red);
        }

        .score-badge {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            color: var(--slavic-red);
            font-size: 1.05rem;
        }

        /* Tarjeta de pregunta */
        .question-box {
            text-align: center;
            margin-bottom: 24px;
        }

        .illustration-frame {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            background-color: var(--bg-parchment);
            border: 3px solid var(--slavic-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        .illustration-frame::after {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1.5px dashed var(--ochre-gold);
            border-radius: 50%;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink-dark);
            line-height: 1.45;
        }

        /* Opciones de respuesta */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
        }

        .option-btn {
            background-color: var(--bg-parchment);
            border: 2.5px solid var(--border-wood);
            border-radius: 12px;
            padding: 15px 20px;
            font-family: 'Lora', serif;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--ink-dark);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #F4E5C3;
            border-color: var(--slavic-red);
            transform: translateX(4px);
        }

        .option-letter {
            width: 34px;
            height: 34px;
            background-color: var(--cobalt-blue);
            color: white;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: rotate(45deg);
        }

        .option-letter span {
            transform: rotate(-45deg);
        }

        .option-btn.selected-correct {
            background-color: #D9EFE0;
            border-color: var(--forest-green);
            color: #153320;
            font-weight: 700;
        }

        .option-btn.selected-correct .option-letter {
            background-color: var(--forest-green);
        }

        .option-btn.selected-wrong {
            background-color: #FADBD8;
            border-color: var(--slavic-red);
            color: #641E16;
        }

        .option-btn.selected-wrong .option-letter {
            background-color: var(--slavic-red);
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Caja de retroalimentación */
        .feedback-box {
            display: none;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.5;
            border-left: 6px solid;
            animation: fadeIn 0.35s ease;
        }

        .feedback-box.correct {
            display: block;
            background-color: #E8F6EC;
            border-color: var(--forest-green);
            color: #183A24;
        }

        .feedback-box.wrong {
            display: block;
            background-color: #FDEDEC;
            border-color: var(--slavic-red);
            color: #78281F;
        }

        /* Botón principal estilo folk */
        .action-area {
            text-align: center;
        }

        .folk-btn {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            font-size: 1.1rem;
            background-color: var(--slavic-red);
            color: #FFFDF7;
            border: 3px solid var(--ochre-gold);
            padding: 13px 30px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(178, 34, 34, 0.35);
            transition: all 0.2s ease;
        }

        .folk-btn:hover {
            background-color: var(--slavic-red-dark);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        /* Pantalla final */
        .result-screen {
            text-align: center;
            padding: 15px 10px;
        }

        .result-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.8rem;
            color: var(--slavic-red);
            margin-bottom: 12px;
        }

        .result-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--forest-green);
            margin-bottom: 16px;
        }

        .result-message {
            font-size: 1.15rem;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .content-area { padding: 20px 18px; }
            .question-text { font-size: 1.15rem; }
            .option-btn { font-size: 1.02rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

    <div class="main-frame">
        <div class="folk-border-strip"></div>
        
        <header>
            <div class="folk-ornament">
                <!-- Motivo floral/geométrico estilo Slavic Folk en SVG -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#D99B26"/>
                    <circle cx="12" cy="12" r="3" fill="#B22222"/>
                </svg>
                <span style="font-family: 'Cinzel Decorative', serif; color: #FBF4E4; font-size: 0.9rem; letter-spacing: 2px;">CIENCIAS DE LA NATURALEZA · 3º PRIMARIA</span>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#D99B26"/>
                    <circle cx="12" cy="12" r="3" fill="#B22222"/>
                </svg>
            </div>
            <h1>El Bosque de los Invertebrados</h1>
            <p class="subtitle">Descubre los secretos de las pequeñas criaturas del bosque encantado</p>
        </header>

        <div class="content-area">
            <!-- Pantalla de Juego -->
            <div id="quiz-screen">
                <div class="progress-container">
                    <div class="step-dots" id="step-dots">
                        <div class="dot active">1</div>
                        <div class="dot">2</div>
                        <div class="dot">3</div>
                        <div class="dot">4</div>
                        <div class="dot">5</div>
                    </div>
                    <div class="score-badge">Puntos: <span id="score-display">0</span> / 5</div>
                </div>

                <div class="question-box">
                    <div class="illustration-frame" id="question-icon">
                        <!-- Icono SVG dinámico por pregunta -->
                    </div>
                    <p class="question-text" id="question-text">Cargando pregunta...</p>
                </div>

                <div class="options-grid" id="options-container">
                    <!-- Opciones generadas por JS -->
                </div>

                <div class="feedback-box" id="feedback-box"></div>

                <div class="action-area">
                    <button class="folk-btn hidden" id="next-btn" onclick="nextQuestion()">Siguiente Pregunta ➔</button>
                </div>
            </div>

            <!-- Pantalla Final -->
            <div id="result-screen" class="result-screen hidden">
                <div class="illustration-frame" style="width: 130px; height: 130px; margin-bottom: 20px;">
                    <svg width="75" height="75" viewBox="0 0 64 64" fill="none">
                        <!-- Sol / Flor eslava de victoria -->
                        <circle cx="32" cy="32" r="14" fill="#D99B26" stroke="#B22222" stroke-width="3"/>
                        <path d="M32 4L36 16L32 18L28 16L32 4Z" fill="#B22222"/>
                        <path d="M32 60L36 48L32 46L28 48L32 60Z" fill="#B22222"/>
                        <path d="M4 32L16 28L18 32L16 36L4 32Z" fill="#B22222"/>
                        <path d="M60 32L48 28L46 32L48 36L60 32Z" fill="#B22222"/>
                        <path d="M12 12L22 18L20 22L16 22L12 12Z" fill="#234D32"/>
                        <path d="M52 52L42 46L44 42L48 42L52 52Z" fill="#234D32"/>
                        <path d="M52 12L42 18L44 22L48 22L52 12Z" fill="#234D32"/>
                        <path d="M12 52L22 46L20 42L16 42L12 52Z" fill="#234D32"/>
                    </svg>
                </div>
                <h2 class="result-title" id="result-title">¡Aventura Completada!</h2>
                <p class="result-score" id="final-score">Has conseguido 5 de 5 puntos</p>
                <p class="result-message" id="result-message"></p>
                <button class="folk-btn" onclick="restartQuiz()">Volver a Jugar ↻</button>
            </div>
        </div>

        <div class="folk-border-strip"></div>
    </div>

    <script>
        const questions = [
            {
                question: "¿Qué característica principal tienen TODOS los animales invertebrados?",
                options: [
                    "No tienen columna vertebral ni esqueleto interno con huesos.",
                    "Todos tienen alas para volar entre los árboles.",
                    "Viven siempre debajo del agua del mar."
                ],
                correct: 0,
                explanation: "¡Muy bien! Los invertebrados son animales que no tienen columna vertebral ni huesos por dentro.",
                svg: `<svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <path d="M16 44C16 30 26 22 36 22C46 22 50 32 46 40C42 46 32 46 30 40C28 35 33 31 37 33" stroke="#B22222" stroke-width="4" stroke-linecap="round"/>
                        <path d="M10 46H52" stroke="#234D32" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="14" cy="38" r="2" fill="#1D4E89"/>
                        <path d="M14 40L10 34M16 40L15 33" stroke="#1D4E89" stroke-width="2" stroke-linecap="round"/>
                      </svg>`
            },
            {
                question: "En el claro del bosque vemos una mariposa y una abeja. ¿Cuántas patas tienen los insectos?",
                options: [
                    "Tienen 8 patas.",
                    "Tienen 6 patas.",
                    "No tienen ninguna pata."
                ],
                correct: 1,
                explanation: "¡Exacto! Todos los insectos, como las abejas, hormigas y mariposas, tienen 6 patas y suelen tener antenas.",
                svg: `<svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <ellipse cx="32" cy="34" rx="5" ry="14" fill="#2B1E16"/>
                        <path d="M27 28C16 16 10 26 20 34C12 40 18 50 27 40" fill="#D99B26" stroke="#B22222" stroke-width="2.5"/>
                        <path d="M37 28C48 16 54 26 44 34C52 40 46 50 37 40" fill="#D99B26" stroke="#B22222" stroke-width="2.5"/>
                        <path d="M30 20L24 12M34 20L40 12" stroke="#2B1E16" stroke-width="2" stroke-linecap="round"/>
                      </svg>`
            },
            {
                question: "El caracol lleva su casa a cuestas y tiene el cuerpo muy blando. ¿A qué grupo pertenece?",
                options: [
                    "Al grupo de los moluscos.",
                    "Al grupo de los arácnidos.",
                    "Al grupo de los peces."
                ],
                correct: 0,
                explanation: "¡Genial! Los caracoles, mejillones y pulpos son moluscos: tienen el cuerpo blando y muchos lo protegen con una concha.",
                svg: `<svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <circle cx="35" cy="32" r="14" fill="#D99B26" stroke="#B22222" stroke-width="3"/>
                        <path d="M35 32C35 28 39 28 39 32C39 37 31 37 31 31C31 24 43 24 43 32" stroke="#801313" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M12 46H48C50 46 50 42 46 42H22C18 42 16 36 14 36C12 36 12 46 12 46Z" fill="#234D32"/>
                      </svg>`
            },
            {
                question: "¿En qué se diferencia una araña de una hormiga?",
                options: [
                    "La araña tiene 8 patas y la hormiga tiene 6 patas.",
                    "La araña tiene plumas y la hormiga tiene escamas.",
                    "La araña tiene columna vertebral y la hormiga no."
                ],
                correct: 0,
                explanation: "¡Correcto! Las arañas son arácnidos y tienen 8 patas, mientras que las hormigas son insectos y tienen 6 patas.",
                svg: `<svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <circle cx="32" cy="34" r="9" fill="#2B1E16"/>
                        <circle cx="32" cy="22" r="5" fill="#B22222"/>
                        <path d="M24 28L12 20M23 32L10 30M23 36L10 40M25 40L14 48" stroke="#2B1E16" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M40 28L52 20M41 32L54 30M41 36L54 40M39 40L50 48" stroke="#2B1E16" stroke-width="2.5" stroke-linecap="round"/>
                      </svg>`
            },
            {
                question: "¿Cómo nacen la gran mayoría de los animales invertebrados?",
                options: [
                    "Del vientre de su madre (son vivíparos).",
                    "De huevos (son ovíparos).",
                    "De las semillas de las flores."
                ],
                correct: 1,
                explanation: "¡Fantástico! Casi todos los invertebrados son ovíparos, es decir, nacen de huevos.",
                svg: `<svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                        <path d="M32 12C22 12 16 26 16 38C16 48 23 52 32 52C41 52 48 48 48 38C48 26 42 12 32 12Z" fill="#FFFDF7" stroke="#B22222" stroke-width="3"/>
                        <path d="M18 34L25 28L32 34L39 28L46 34" stroke="#D99B26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="32" cy="42" r="3" fill="#1D4E89"/>
                      </svg>`
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const letters = ["A", "B", "C"];

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestion];
            
            document.getElementById("question-icon").innerHTML = q.svg;
            document.getElementById("question-text").textContent = `${currentQuestion + 1}. ${q.question}`;
            
            const feedbackBox = document.getElementById("feedback-box");
            feedbackBox.className = "feedback-box";
            feedbackBox.textContent = "";
            
            document.getElementById("next-btn").classList.add("hidden");

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `
                    <div class="option-letter"><span>${letters[index]}</span></div>
                    <div>${optionText}</div>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll(".dot");
            dots.forEach((dot, idx) => {
                dot.classList.remove("active");
                if (idx === currentQuestion) {
                    dot.classList.add("active");
                }
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const allButtons = document.querySelectorAll(".option-btn");
            const dots = document.querySelectorAll(".dot");
            const feedbackBox = document.getElementById("feedback-box");

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                score++;
                document.getElementById("score-display").textContent = score;
                btnElement.classList.add("selected-correct");
                dots[currentQuestion].classList.add("correct");
                feedbackBox.className = "feedback-box correct";
                feedbackBox.innerHTML = `<strong>¡Acertaste!</strong> ${q.explanation}`;
            } else {
                btnElement.classList.add("selected-wrong");
                allButtons[q.correct].classList.add("selected-correct");
                dots[currentQuestion].classList.add("wrong");
                feedbackBox.className = "feedback-box wrong";
                feedbackBox.innerHTML = `<strong>¡Casi!</strong> ${q.explanation}`;
            }

            const nextBtn = document.getElementById("next-btn");
            nextBtn.textContent = currentQuestion === questions.length - 1 ? "Ver Resultado Final ★" : "Siguiente Pregunta ➔";
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-score").textContent = `Has conseguido ${score} de ${questions.length} puntos`;

            let msg = "";
            if (score === 5) {
                msg = "¡Eres un auténtico guardián del bosque! Conoces perfectamente a todos los animales invertebrados.";
            } else if (score >= 3) {
                msg = "¡Muy buen trabajo! Sabes muchas cosas sobre los invertebrados, solo te falta un poquito para ser un experto.";
            } else {
                msg = "¡Buen intento! Vuelve a recorrer el bosque encantado para repasar cómo son los animales invertebrados.";
            }
            document.getElementById("result-message").textContent = msg;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById("score-display").textContent = "0";
            const dots = document.querySelectorAll(".dot");
            dots.forEach(dot => {
                dot.className = "dot";
            });
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            loadQuestion();
        }

        // Iniciar actividad
        loadQuestion();
    </script>
</body>
</html>
